<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JTECSOFT KeHoachSX</title>
    <base href="/" />
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!--<link href="css/KeHoachSX.css" rel="stylesheet" />-->
    <link href="KeHoachSX.App.styles.css" rel="stylesheet" />
    <link href="_content/JtecShare.UI/fontawesome/css/all.min.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b, #020617);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .ring-1 {
            width: 100px;
            height: 100px;
            border-top-color: #38bdf8;
            border-bottom-color: #0284c7;
            animation: spin 2s linear infinite;
        }

        .ring-2 {
            width: 120px;
            height: 120px;
            border-left-color: #818cf8;
            border-right-color: #4f46e5;
            animation: spin-reverse 3s linear infinite;
        }

        .core-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            z-index: 10;
            animation: levitate 3s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
        }

        .brand-text {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #e2e8f0, #38bdf8, #e2e8f0);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 2.5s linear infinite;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .progress-bar {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: #38bdf8;
            border-radius: 10px;
            transform-origin: left;
            animation: load-bar 3s ease-out forwards;
            box-shadow: 0 0 10px #38bdf8;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            0% {
                transform: rotate(360deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes levitate {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @keyframes load-bar {
            0% {
                transform: scaleX(0);
            }

            100% {
                transform: scaleX(1);
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="loading-screen">
            <div class="loader-wrapper">
                <div class="logo-container">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <img src="_content/JtecShare.UI/logo-circle-500.png" alt="JTEC Logo" class="core-logo" />
                </div>
                <h1 class="brand-text">JTEC NGHỆ AN</h1>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
